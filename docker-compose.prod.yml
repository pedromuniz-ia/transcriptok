version: "3.8"

# Production config for server with existing PostgreSQL and Redis
# Network: network_public
# PostgreSQL: postgres:5432
# Redis: redis:6379

services:
  transcriptok-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcriptok-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/transcriptok
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODE=api
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=["http://localhost:3000","https://transcriptok.vercel.app"]
    volumes:
      - transcriptok_storage:/app/storage
    networks:
      - network_public
    depends_on:
      - transcriptok-worker

  transcriptok-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcriptok-worker
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info --concurrency=2
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/transcriptok
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODE=api
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STORAGE_PATH=/app/storage
    volumes:
      - transcriptok_storage:/app/storage
    networks:
      - network_public

volumes:
  transcriptok_storage:
    driver: local

networks:
  network_public:
    external: true
